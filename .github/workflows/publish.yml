name: Publish taut-shape to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.15"]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: workspace/taut-shape-py
      - uses: actions/checkout@v6
        with:
          repository: owebeeone/taut-shape
          path: workspace/taut-shape
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install and test
        working-directory: workspace/taut-shape-py
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pytest -q

  build:
    name: Build and smoke-test distributions
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and check
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Smoke-test wheel
        run: |
          python -m pip install dist/*.whl
          python - <<'PY'
          import importlib.metadata as metadata
          import taut_shape
          from taut_shape.atom import wire as atom_wire
          from taut_shape.crdt import wire as crdt_wire
          from taut_shape.stream import wire as stream_wire
          from taut_shape.swmr import wire as swmr_wire
          from taut_shape.value import wire as value_wire
          from taut_shape.tool import oraclefmt

          assert metadata.version("taut-shape") == "${{ github.event.release.tag_name }}".removeprefix("v")
          assert all(module._SCHEMA.messages for module in (
              atom_wire, crdt_wire, stream_wire, swmr_wire, value_wire, oraclefmt
          ))
          print("taut-shape standalone schema imports/version OK")
          PY
          taut-shape-tool --help
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/p/taut-shape
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
